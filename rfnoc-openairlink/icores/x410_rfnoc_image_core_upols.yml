# General parameters
# -----------------------------------------
# SISO Channel Emulator using UPOLS (Uniformly-Partitioned Overlap-Save).
#
# Drop-in replacement for the simple 2-channel sparse-FIR image at the
# topology level: same X410 BSP layout (2 radio blocks × 2 ports = 4 RF
# ports), same sc16 interfaces, single channel emulator instance on the
# downlink, plain shiftright on the uplink.
#
# Topology (one UPOLS instance on the DL path):
#   DL: radio0:out_0 -> upols0 -> shift0 -> radio1:in_0
#   UL: radio1:out_0 ->                  shift1 -> radio0:in_0
#
# Sizing (kept conservative for first FPGA bring-up):
#   N = 256 taps      => P = ceil(N/B) = 2 partitions
#   B = 128 samples   => K = 2*B       = 256 FFT bins
#   H_parts BRAM = P*K * 32b = 2048 * 32b = 64 Kbit  (1× BRAM18 / block)
#
# These match the smallest power-of-two sizes that exercise multiple
# partitions; once the DSP pipeline is stable we can lift them toward
# the spec defaults (N=1024, B=512).

schema: rfnoc_imagebuilder_args
copyright: >-
  Ettus Research, A National Instruments Brand
license: >-
  SPDX-License-Identifier: LGPL-3.0-or-later
version: '1.0'
image_core_name: usrp_x410_lchem_upols_siso
chdr_width: 64
device: 'x410'
default_target: 'X410'

parameters:
  RF_BW: 200
  ENABLE_DRAM: True
  NUM_DRAM_BANKS: 1
  NUM_DRAM_CHANS: 4
  DRAM_WIDTH: 64

# A list of all stream endpoints in design
# ----------------------------------------
stream_endpoints:
  ep0:
    ctrl: True
    data: True
    buff_size_bytes: 262144
  ep1:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep2:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep3:
    ctrl: False
    data: True
    buff_size_bytes: 262144

# A list of all transport adapters in design
# ------------------------------------------
transport_adapters:
  dma:
    block_desc: 'chdr_dma.yml'
  eth_qsfp0:
    block_desc: 'x4xx_eth.yml'
    parameters:
      port_type0: 2  # 10 GbE lane 0
      port_type1: 2  # 10 GbE lane 1
      port_type2: 2  # 10 GbE lane 2
      port_type3: 2  # 10 GbE lane 3
      qsfp_num: 0

# A list of all NoC blocks in design
# ----------------------------------
noc_blocks:
  radio0:
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio
  radio1:
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio

  # The single UPOLS channel emulator (downlink path).
  upols0:
    block_desc: 'upols.yml'
    parameters:
      N: 256
      B: 128

  # Output attenuation, identical to the sparse-FIR image cores.
  shift0:
    block_desc: 'shiftright.yml'
  shift1:
    block_desc: 'shiftright.yml'

# A list of all static connections in design
# ------------------------------------------
connections:
  # ------- Downlink (the UPOLS-filtered path) -------
  - { srcblk: radio0, srcport: out_0, dstblk: upols0, dstport: in }
  - { srcblk: upols0, srcport: out,   dstblk: shift0, dstport: in }
  - { srcblk: shift0, srcport: out,   dstblk: radio1, dstport: in_0 }

  # ------- Uplink (plain attenuator passthrough) -------
  - { srcblk: radio1, srcport: out_0, dstblk: shift1, dstport: in }
  - { srcblk: shift1, srcport: out,   dstblk: radio0, dstport: in_0 }

  # ------- Unused RF channels routed to/from EPs -------
  - { srcblk: radio0, srcport: out_1, dstblk: ep1,    dstport: in0 }
  - { srcblk: radio1, srcport: out_1, dstblk: ep3,    dstport: in0 }
  - { srcblk: ep0,    srcport: out0,  dstblk: radio0, dstport: in_1 }
  - { srcblk: ep2,    srcport: out0,  dstblk: radio1, dstport: in_1 }

  # ------- BSP -------
  - { srcblk: radio0,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio0 }
  - { srcblk: radio1,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio1 }
  - { srcblk: _device_, srcport: radio0,   dstblk: radio0,   dstport: radio }
  - { srcblk: _device_, srcport: radio1,   dstblk: radio1,   dstport: radio }
  - { srcblk: _device_, srcport: time,     dstblk: radio0,   dstport: time }
  - { srcblk: _device_, srcport: time,     dstblk: radio1,   dstport: time }

  # ------- Transport adapters -------
  - { srcblk: dma,       srcport: chdr_dma_s, dstblk: _device_, dstport: chdr_dma_s }
  - { srcblk: _device_,  srcport: chdr_dma_m, dstblk: dma,      dstport: chdr_dma_m }
  - { srcblk: eth_qsfp0, srcport: qsfp,       dstblk: _device_, dstport: qsfp0 }

# A list of all clock domain connections in design
# ------------------------------------------------
clk_domains:
  - { srcblk: _device_, srcport: radio, dstblk: radio0, dstport: radio }
  - { srcblk: _device_, srcport: radio, dstblk: radio1, dstport: radio }
  - { srcblk: _device_, srcport: ce,    dstblk: upols0, dstport: ce }
  - { srcblk: _device_, srcport: ce,    dstblk: shift0, dstport: ce }
  - { srcblk: _device_, srcport: ce,    dstblk: shift1, dstport: ce }
