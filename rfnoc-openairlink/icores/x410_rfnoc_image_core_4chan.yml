# General parameters
# -----------------------------------------
# 1 gNB + 3 UE Bidirectional Channel Emulator Configuration
# 
# Topology:
#   gNB <---> radio0 (RX: gNB TX, TX: combined UL to gNB)
#   UE1 <---> radio1 (RX: UE1 TX, TX: DL to UE1)
#   UE2 <---> radio2 (RX: UE2 TX, TX: DL to UE2)
#   UE3 <---> radio3 (RX: UE3 TX, TX: DL to UE3)
#
# Signal Flow:
#   DOWNLINK: radio0_RX -> SPLIT -> FIR -> shift -> radio1/2/3_TX
#   UPLINK:   radio1/2/3_RX -> FIR -> shift -> ADDER -> radio0_TX


########################################################################
# SPLIT (1→3):  split0 ──┬── out_0 (direct to UE1)
#                        └── out_1 ──► split1 ──┬── out_0 (to UE2)
#                                               └── out_1 (to UE3)

# ADD (3→1):    UE1 ──┐
#                     ├──► addsub0 ──┐
#               UE2 ──┘              ├──► addsub1 ──► gNB
#               UE3 ─────────────────┘
########################################################################


schema: rfnoc_imagebuilder_args
copyright: >-
  Ettus Research, A National Instruments Brand
license: >-
  SPDX-License-Identifier: LGPL-3.0-or-later
version: '1.0'
chdr_width: 64
device: 'x410'
default_target: 'X410'

parameters:
  RF_BW: 200
  ENABLE_DRAM: True
  NUM_DRAM_BANKS: 1
  NUM_DRAM_CHANS: 4
  DRAM_WIDTH: 64

# A list of all stream endpoints in design
# ----------------------------------------
stream_endpoints:
  ep0:
    ctrl: True
    data: True
    buff_size_bytes: 262144
  ep1:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep2:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep3:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep4:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep5:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep6:
    ctrl: False
    data: True
    buff_size_bytes: 262144
  ep7:
    ctrl: False
    data: True
    buff_size_bytes: 262144

# A list of all transport adapters in design
# ------------------------------------------
transport_adapters:
  dma:
    block_desc: 'chdr_dma.yml'
  eth_qsfp0:
    block_desc: 'x4xx_eth.yml'
    parameters:
      port_type0: 2  # 10 GbE lane 0
      port_type1: 2  # 10 GbE lane 1
      port_type2: 2  # 10 GbE lane 2
      port_type3: 2  # 10 GbE lane 3
      qsfp_num: 0

# A list of all NoC blocks in design
# ----------------------------------
noc_blocks:
  # ============================================
  # RADIOS (4 radios, using port 0 of each)
  # ============================================
  radio0:  # gNB side
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio
  radio1:  # UE1 side
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio
  radio2:  # UE2 side
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio
  radio3:  # UE3 side
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
    ctrl_clock: _device_.rfnoc_ctrl
    timebase_clock: _device_.radio

  # ============================================
  # DOWNLINK PATH: gNB TX -> 3 UE RX
  # radio0_RX -> split -> FIR -> shift -> radio1/2/3_TX
  # ============================================
  # SplitStream: NUM_PORTS = number of input streams, NUM_BRANCHES = copies per input
  # split0: 1 input -> 2 branches (one direct to UE1, one to split1)
  # split1: 1 input -> 2 branches (to UE2 and UE3)
  split0:
    block_desc: 'split_stream.yml'
    parameters:
      NUM_PORTS: 1
      NUM_BRANCHES: 2
  split1:
    block_desc: 'split_stream.yml'
    parameters:
      NUM_PORTS: 1
      NUM_BRANCHES: 2

  # Downlink channel emulation (one per UE)
  fir_dl0:  # DL channel to UE1
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1
  fir_dl1:  # DL channel to UE2
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1
  fir_dl2:  # DL channel to UE3
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1

  shift_dl0:  # DL attenuation to UE1
    block_desc: 'shiftright.yml'
  shift_dl1:  # DL attenuation to UE2
    block_desc: 'shiftright.yml'
  shift_dl2:  # DL attenuation to UE3
    block_desc: 'shiftright.yml'

  # ============================================
  # UPLINK PATH: 3 UE TX -> gNB RX
  # radio1/2/3_RX -> FIR -> shift -> adder -> radio0_TX
  # ============================================
  
  # Uplink channel emulation (one per UE)
  fir_ul0:  # UL channel from UE1
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1
  fir_ul1:  # UL channel from UE2
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1
  fir_ul2:  # UL channel from UE3
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 1

  shift_ul0:  # UL attenuation from UE1
    block_desc: 'shiftright.yml'
  shift_ul1:  # UL attenuation from UE2
    block_desc: 'shiftright.yml'
  shift_ul2:  # UL attenuation from UE3
    block_desc: 'shiftright.yml'

  # AddSub only supports 2 inputs, so we cascade two
  # addsub0: UE1 + UE2 -> intermediate
  # addsub1: intermediate + UE3 -> combined uplink
  addsub0:
    block_desc: 'addsub.yml'
  addsub1:
    block_desc: 'addsub.yml'

# A list of all static connections in design
# ------------------------------------------
connections:
  # ============================================
  # DOWNLINK PATH: gNB -> UEs
  # ============================================
  # gNB TX signal received at radio0 RX, split to 3 paths (cascaded)
  - { srcblk: radio0,    srcport: out_0,  dstblk: split0,    dstport: in_0 }
  
  # First split: one output direct, one to second splitter
  - { srcblk: split0,    srcport: out_0,  dstblk: fir_dl0,   dstport: in_0 }  # Direct to UE1
  - { srcblk: split0,    srcport: out_1,  dstblk: split1,    dstport: in_0 }  # To second splitter
  
  # Second split: to UE2 and UE3
  - { srcblk: split1,    srcport: out_0,  dstblk: fir_dl1,   dstport: in_0 }
  - { srcblk: split1,    srcport: out_1,  dstblk: fir_dl2,   dstport: in_0 }
  
  # FIR -> Shift for each DL path
  - { srcblk: fir_dl0,   srcport: out_0,  dstblk: shift_dl0, dstport: in }
  - { srcblk: fir_dl1,   srcport: out_0,  dstblk: shift_dl1, dstport: in }
  - { srcblk: fir_dl2,   srcport: out_0,  dstblk: shift_dl2, dstport: in }
  
  # Shift output to UE radios TX
  - { srcblk: shift_dl0, srcport: out,    dstblk: radio1,    dstport: in_0 }
  - { srcblk: shift_dl1, srcport: out,    dstblk: radio2,    dstport: in_0 }
  - { srcblk: shift_dl2, srcport: out,    dstblk: radio3,    dstport: in_0 }

  # ============================================
  # UPLINK PATH: UEs -> gNB
  # ============================================
  # UE TX signals received at radio1/2/3 RX
  - { srcblk: radio1,    srcport: out_0,  dstblk: fir_ul0,   dstport: in_0 }
  - { srcblk: radio2,    srcport: out_0,  dstblk: fir_ul1,   dstport: in_0 }
  - { srcblk: radio3,    srcport: out_0,  dstblk: fir_ul2,   dstport: in_0 }
  
  # FIR -> Shift for each UL path
  - { srcblk: fir_ul0,   srcport: out_0,  dstblk: shift_ul0, dstport: in }
  - { srcblk: fir_ul1,   srcport: out_0,  dstblk: shift_ul1, dstport: in }
  - { srcblk: fir_ul2,   srcport: out_0,  dstblk: shift_ul2, dstport: in }
  
  # Shift outputs combined via cascaded addsub blocks
  # First addsub: UE1 + UE2
  - { srcblk: shift_ul0, srcport: out,    dstblk: addsub0,   dstport: in_a }
  - { srcblk: shift_ul1, srcport: out,    dstblk: addsub0,   dstport: in_b }
  
  # Second addsub: (UE1+UE2) + UE3
  - { srcblk: addsub0,   srcport: add,    dstblk: addsub1,   dstport: in_a }
  - { srcblk: shift_ul2, srcport: out,    dstblk: addsub1,   dstport: in_b }
  
  # Combined uplink to gNB radio TX
  - { srcblk: addsub1,   srcport: add,    dstblk: radio0,    dstport: in_0 }

  # ============================================
  # UNUSED PORTS -> Stream Endpoints (for debug/monitoring)
  # ============================================
  # Second RX channels (unused in main path)
  - { srcblk: radio0, srcport: out_1, dstblk: ep0, dstport: in0 }
  - { srcblk: radio1, srcport: out_1, dstblk: ep1, dstport: in0 }
  - { srcblk: radio2, srcport: out_1, dstblk: ep2, dstport: in0 }
  - { srcblk: radio3, srcport: out_1, dstblk: ep3, dstport: in0 }
  
  # Second TX channels (unused in main path)
  - { srcblk: ep4, srcport: out0, dstblk: radio0, dstport: in_1 }
  - { srcblk: ep5, srcport: out0, dstblk: radio1, dstport: in_1 }
  - { srcblk: ep6, srcport: out0, dstblk: radio2, dstport: in_1 }
  - { srcblk: ep7, srcport: out0, dstblk: radio3, dstport: in_1 }

  # ============================================
  # BSP Connections
  # ============================================
  - { srcblk: radio0,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio0 }
  - { srcblk: radio1,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio1 }
  - { srcblk: radio2,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio2 }
  - { srcblk: radio3,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio3 }
  - { srcblk: _device_, srcport: radio0,   dstblk: radio0,   dstport: radio }
  - { srcblk: _device_, srcport: radio1,   dstblk: radio1,   dstport: radio }
  - { srcblk: _device_, srcport: radio2,   dstblk: radio2,   dstport: radio }
  - { srcblk: _device_, srcport: radio3,   dstblk: radio3,   dstport: radio }
  - { srcblk: _device_, srcport: time,     dstblk: radio0,   dstport: time }
  - { srcblk: _device_, srcport: time,     dstblk: radio1,   dstport: time }
  - { srcblk: _device_, srcport: time,     dstblk: radio2,   dstport: time }
  - { srcblk: _device_, srcport: time,     dstblk: radio3,   dstport: time }

  # Transport Adapter Connections
  - { srcblk: dma,       srcport: chdr_dma_s, dstblk: _device_, dstport: chdr_dma_s }
  - { srcblk: _device_,  srcport: chdr_dma_m, dstblk: dma,      dstport: chdr_dma_m }
  - { srcblk: eth_qsfp0, srcport: qsfp,       dstblk: _device_, dstport: qsfp0 }

# A list of all clock domain connections in design
# ------------------------------------------------
clk_domains:
  # Radios
  - { srcblk: _device_, srcport: radio, dstblk: radio0, dstport: radio }
  - { srcblk: _device_, srcport: radio, dstblk: radio1, dstport: radio }
  - { srcblk: _device_, srcport: radio, dstblk: radio2, dstport: radio }
  - { srcblk: _device_, srcport: radio, dstblk: radio3, dstport: radio }
  
  # Downlink processing blocks
  - { srcblk: _device_, srcport: ce, dstblk: split0,    dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: split1,    dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: fir_dl0,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: fir_dl1,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: fir_dl2,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_dl0, dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_dl1, dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_dl2, dstport: ce }
  
  # Uplink processing blocks
  - { srcblk: _device_, srcport: ce, dstblk: fir_ul0,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: fir_ul1,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: fir_ul2,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_ul0, dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_ul1, dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: shift_ul2, dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: addsub0,   dstport: ce }
  - { srcblk: _device_, srcport: ce, dstblk: addsub1,   dstport: ce }
